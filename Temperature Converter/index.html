<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="Stylesheet" href="style.css">
    <title>Practice</title>
</head>
<body>
    <div class="container">
        <h2>Temperature converter</h2>
        <input type="number" id="Input"><br><br>
        <input type="radio" id="CtF" name="set"><label for="CtF">Celcius to Fahrenheit</label><br>
        <input type="radio" id="FtC" name="set"><label for="FtC">Fahrenheit to Celcius</label><br><br>
        <button type="submit" id="Submitbtn">Submit</button><br><br>
        <span>Result: </span><span id="Result"></span>
    </div>
    <script src="script.js"></script>
</body>
</html>
