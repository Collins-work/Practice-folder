<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="Stylesheet" href="style.css">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div id="btn-container">
        <button type="button" id="Rock" class="hands">👊</button>
        <button type="button" id="Paper" class="hands">✋</button>
        <button type="button" id="Scissors" class="hands">✌️</button>
    </div>

    <h1 id="counter">Start</h1>
    <button id="Start-btn">Start game</button><br><br>

    <span>Result: </span><span id="result"></span>

    <script src="script.js"></script>
</body>
</html>
